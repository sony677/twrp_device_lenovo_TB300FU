name: Build TWRP boot image

on:
  workflow_dispatch:
    inputs:
      crypto:
        description: Build the experimental Beanpod metadata/FBE integration
        type: boolean
        default: false
  push:
    branches:
      - main
      - codex/adb-crypto-preparation
    paths:
      - .github/workflows/build.yml
      - Android.mk
      - AndroidProducts.mk
      - BoardConfig.mk
      - device.mk
      - twrp_TB300FU.mk
      - prebuilt/kernel
      - prebuilt/dtb.img
      - recovery/**
      - scripts/**
      - config/**
      - crypto/**
      - tests/**

env:
  TB300FU_ENABLE_CRYPTO: ${{ (github.ref == 'refs/heads/codex/adb-crypto-preparation' || inputs.crypto == true) && 'true' || 'false' }}

permissions:
  contents: read

concurrency:
  group: twrp-TB300FU-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Validate tree and stock prebuilts
        run: bash scripts/validate-tree.sh --require-prebuilts

      - name: Test preparation, fail-closed paths and configuration
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify crypto patch against pinned upstream source
        run: |
          mkdir -p "$RUNNER_TEMP/twrp-patch-test/etc/init"
          curl -fsSL https://raw.githubusercontent.com/TeamWin/android_bootable_recovery/5c3d206a5eeb3d446bcda8248a405a4b278bab5c/partitionmanager.cpp -o "$RUNNER_TEMP/twrp-patch-test/partitionmanager.cpp"
          curl -fsSL https://raw.githubusercontent.com/TeamWin/android_bootable_recovery/5c3d206a5eeb3d446bcda8248a405a4b278bab5c/etc/init/keystore2.rc -o "$RUNNER_TEMP/twrp-patch-test/etc/init/keystore2.rc"
          python3 scripts/patch-twrp-crypto.py "$RUNNER_TEMP/twrp-patch-test"
          python3 scripts/patch-twrp-crypto.py "$RUNNER_TEMP/twrp-patch-test"

  build:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ALLOW_MISSING_DEPENDENCIES: "true"
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: /tmp/tb300fu-ccache

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 12.1 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            --depth=1
          "$HOME/bin/repo" sync -c -j2 --force-sync --no-clone-bundle --no-tags

      - name: Install TB300FU device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android/device/lenovo/TB300FU"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ccache/' \
            "$GITHUB_WORKSPACE/tree/" \
            "$GITHUB_WORKSPACE/android/device/lenovo/TB300FU/"

      - name: Apply experimental pre-metadata integration
        if: env.TB300FU_ENABLE_CRYPTO == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android/bootable/recovery"
          git fetch --depth=1 https://github.com/TeamWin/android_bootable_recovery.git 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
          git checkout --detach 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
          python3 "$GITHUB_WORKSPACE/tree/scripts/patch-twrp-crypto.py" .
          echo 'TB300FU_CRYPTO_HOOK_APPLIED=true' >> "$GITHUB_ENV"

      - name: Build recovery-as-boot image
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch twrp_TB300FU-eng
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          mka -j2 bootimage 2>&1 | tee "$RUNNER_TEMP/tb300fu-build.log"

      - name: Check experimental ramdisk contents
        if: env.TB300FU_ENABLE_CRYPTO == 'true'
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/android/out/target/product/TB300FU/recovery/root"
          test -s "$root/system/bin/tb300fu-crypto-prepare.sh"
          test -x "$root/system/bin/tb300fu_crypto_probe"
          test -x "$root/system/bin/keystore2"
          test -s "$root/init.recovery.crypto.rc"
          grep -q /tmp/misc/keystore "$root/system/etc/init/keystore2.rc"

      - name: Add unsigned AVB footer and inspect image
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source_image="out/target/product/TB300FU/boot.img"
          profile=usb-default
          if [ "$TB300FU_ENABLE_CRYPTO" = true ]; then profile=crypto-experimental; fi
          output_image="$RUNNER_TEMP/twrp-TB300FU-S101116-$profile.img"
          echo "TB300FU_ARTIFACT=twrp-TB300FU-S101116-$profile" >> "$GITHUB_ENV"

          test -f "$source_image"

          python3 - "$source_image" <<'PY'
          import hashlib
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as stream:
              image = stream.read()

          assert image[:8] == b"ANDROID!", "invalid boot magic"
          kernel_size = struct.unpack_from("<I", image, 8)[0]
          ramdisk_size = struct.unpack_from("<I", image, 16)[0]
          page_size = struct.unpack_from("<I", image, 36)[0]
          header_version = struct.unpack_from("<I", image, 40)[0]
          dtb_size = struct.unpack_from("<I", image, 1648)[0]
          kernel = image[page_size:page_size + kernel_size]
          kernel_sha = hashlib.sha256(kernel).hexdigest()
          primary_cmdline = image[64:576].split(b"\0", 1)[0]
          extra_cmdline = image[608:1632].split(b"\0", 1)[0]
          cmdline = b" ".join((primary_cmdline + b" " + extra_cmdline).split()).decode("ascii")

          assert kernel_size == 11843144, f"wrong kernel size: {kernel_size}"
          assert kernel_sha == "bf458fac663e61a4081de1e7826f9d9e836decfbaea342d172376eae62742188", kernel_sha
          assert page_size == 2048, f"wrong page size: {page_size}"
          assert header_version == 2, f"wrong header version: {header_version}"
          assert dtb_size == 120386, f"wrong DTB size: {dtb_size}"
          assert kernel[:4] == bytes.fromhex("0000a0e1"), "ARM zImage wrapper is missing"
          ramdisk_offset = page_size + ((kernel_size + page_size - 1) // page_size) * page_size
          assert image[ramdisk_offset:ramdisk_offset + 2] == bytes.fromhex("1f8b"), "stock kernel requires gzip ramdisk"
          assert "twrpfastboot=" not in cmdline, f"normal-boot loop flag remains: {cmdline}"
          assert "bootopt=64S3,32S1,32S1" in cmdline, f"stock boot options are missing: {cmdline}"
          assert cmdline.count("buildvariant=") == 1, f"duplicate buildvariant: {cmdline}"
          print(f"Verified boot image: kernel={kernel_size}, ramdisk={ramdisk_size}, dtb={dtb_size}, sha256={kernel_sha}")
          print(f"Verified normal-boot cmdline: {cmdline}")
          PY

          cp "$source_image" "$output_image"

          if out/host/linux-x86/bin/avbtool info_image --image "$output_image" >/dev/null 2>&1; then
            echo "The build already produced an AVB footer."
          else
            image_size=$(stat -c '%s' "$output_image")
            if (( image_size >= 33554432 )); then
              echo "Image is too large for the 32 MiB boot partition: $image_size bytes." >&2
              exit 1
            fi
            out/host/linux-x86/bin/avbtool add_hash_footer \
              --image "$output_image" \
              --partition_name boot \
              --partition_size 33554432 \
              --algorithm NONE
          fi

          test "$(stat -c '%s' "$output_image")" = "33554432"
          test "$(head -c 8 "$output_image")" = "ANDROID!"
          sha256sum "$output_image"
          out/host/linux-x86/bin/avbtool info_image --image "$output_image"

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TB300FU_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TB300FU_ARTIFACT }}.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb300fu-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/tb300fu-build.log
          if-no-files-found: ignore
          retention-days: 14
