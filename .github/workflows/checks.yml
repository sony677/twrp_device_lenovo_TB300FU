name: Check USB and crypto preparation
on:
  push:
    branches: ['codex/adb-crypto-preparation']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-tree.sh --require-prebuilts
      - run: python3 scripts/check-config.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --only-binary=:all: --no-deps -r scripts/requirements-compression.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Collector.ps1
      - name: Test collector in PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/Test-Collector.ps1
      - name: Test offline analyzer in Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./tests/Test-Analyzer.ps1
      - name: Test offline analyzer in PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/Test-Analyzer.ps1
